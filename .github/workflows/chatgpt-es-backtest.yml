name: ChatGPT ES Backtest
on:
  push:
    branches:
      - chatgpt-es-backtest
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ES backtest
        run: |
          cd tmp_backtest
          python es_backtest.py
