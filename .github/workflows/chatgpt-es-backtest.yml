name: ChatGPT ES Backtest
on:
  push:
    branches:
      - chatgpt-es-backtest
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: pip install -q numpy scikit-learn
      - name: Run frozen ES model backtest
        run: |
          cd tmp_backtest
          python hidden_strategy.py
